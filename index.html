<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volta à Ilha World – Alex</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--cell:5px;--ink:#f8f8f8;--gold:#f8d820;--red:#e83030;--blue:#2f66d0;--panel:#181818}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1b2f6b;color:var(--ink);font:20px/1.15 "VT323","Courier New",monospace;image-rendering:pixelated}
body{background:
  linear-gradient(#0000 0 0),
  repeating-linear-gradient(0deg,#1d3a82 0 4px,#1b2f6b 4px 8px);min-height:100vh}
.ps{font-family:"Press Start 2P","Courier New",monospace;letter-spacing:0}
/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;justify-content:center;background:#000;padding:12px 16px;border-bottom:4px solid #f8f8f8;font:11px/1.5 "Press Start 2P","Courier New",monospace;text-transform:uppercase}
.hud b{color:var(--gold);font-weight:400}.hud .r{color:#ff6a6a}
.coin{display:inline-block;width:12px;height:14px;background:var(--gold);border:2px solid #a07800;border-radius:50%;vertical-align:-2px;margin-right:6px}
.meter{display:flex;gap:2px;align-items:center}
.meter i{width:12px;height:14px;background:#5a5a1a;border:2px solid #000;outline:1px solid #777}
.meter i.on{background:var(--red);outline-color:#fff}.meter i.rep{background:var(--gold)}
.wrap{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:16px;flex-wrap:wrap}
.frame{position:relative;border:4px solid #000;box-shadow:0 0 0 4px #f8f8f8,0 0 0 8px #000;background:#2f66d0;line-height:0}
.frame canvas,.frame svg{display:block;image-rendering:pixelated;width:calc(var(--gw)*var(--cell));height:calc(var(--gh)*var(--cell))}
.layer{position:absolute;left:0;top:0}
.lab{position:absolute;transform:translate(-50%,0);font:calc(var(--cell)*2.1)/1 "Press Start 2P",monospace;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;pointer-events:none;line-height:1}
#hl{animation:blink .5s steps(1) infinite}@keyframes blink{50%{opacity:.25}}
.sprite{position:absolute;pointer-events:none;image-rendering:pixelated}
#mario{animation:bob 0.7s steps(1) infinite}@keyframes bob{50%{transform:translateY(calc(var(--cell)*-1))}}
svg .hit{fill:none;stroke:transparent;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:pointer}
svg .nd{fill:transparent;pointer-events:all;cursor:pointer}
/* painel */
aside{width:360px;max-width:100%;background:var(--panel);border:4px solid #000;box-shadow:0 0 0 4px #f8f8f8,0 0 0 8px #000;padding:12px}
aside h2{font:11px/1.6 "Press Start 2P",monospace;color:var(--gold);margin:0 0 8px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:0 0 10px;font-size:18px;color:#cfd8ff}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #000;vertical-align:-1px;margin-right:5px;outline:1px solid #fff}
.dot.c{background:var(--red)}.dot.u{background:var(--gold)}
ol{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
li{display:grid;grid-template-columns:30px 1fr auto;gap:0 8px;align-items:center;padding:5px 6px;cursor:pointer;border:2px solid transparent}
li:hover,li.on{background:#2a2a5a;border-color:var(--gold)}
li .n{width:26px;height:26px;border-radius:50%;border:3px solid #000;outline:1px solid #fff;background:var(--gold);color:#000;font:9px/20px "Press Start 2P",monospace;text-align:center}
li.done .n{background:var(--red);color:#fff}
li .t{font-size:19px;line-height:1}li .k{color:#9fb0ff;font-size:19px}
li .y{grid-column:2/4;font-size:18px;color:#ff9c9c}li.todo .y{color:#8e97c8}
li .rp{color:var(--gold)}
.note{margin-top:8px;font-size:16px;color:#9fb0ff;line-height:1.1}
/* balão estilo caixa de mensagem */
#tip{position:fixed;z-index:50;pointer-events:none;display:none;max-width:330px;background:var(--panel);color:#fff;border:4px solid #fff;box-shadow:0 0 0 4px #000,6px 6px 0 4px rgba(0,0,0,.5);padding:10px 12px;line-height:1.05}
#tip h4{font:10px/1.5 "Press Start 2P",monospace;color:var(--gold);margin:0 0 4px;text-transform:uppercase}
#tip .nm{font-size:19px;color:#cfd8ff;margin-bottom:6px}
#tip .ok{color:#ff7a7a;font-size:21px}#tip .no{color:#9aa4d6;font-size:21px}
#tip table{border-collapse:collapse;margin-top:3px}#tip td{padding:0 12px 0 0;font-size:21px}
#tip .rp{margin-top:6px;padding:4px 6px;background:#4a3a00;border:2px solid var(--gold);color:var(--gold);font-size:19px}
#tip small{display:block;margin-top:4px;color:#9aa4d6;font-size:16px}
@media (max-width:900px){.wrap{padding:10px}}
</style>
</head>

</div>

const RUNS = [{"trecho": 7, "ano": 2022, "tempo": "01:12:50", "pace": "6:55", "conf": "Alta"}, {"trecho": 15, "ano": 2022, "tempo": "00:52:05", "pace": "5:46", "conf": "Alta"}, {"trecho": 1, "ano": 2023, "tempo": "00:32:02", "pace": "4:25", "conf": "Confirmado"}, {"trecho": 16, "ano": 2023, "tempo": "01:28:49", "pace": "5:21", "conf": "Confirmado"}, {"trecho": 3, "ano": 2024, "tempo": "00:36:38", "pace": "4:30", "conf": "Confirmado"}, {"trecho": 11, "ano": 2024, "tempo": "00:25:53", "pace": "4:36", "conf": "Confirmado"}, {"trecho": 18, "ano": 2024, "tempo": "00:35:10", "pace": "4:43", "conf": "Confirmado"}, {"trecho": 6, "ano": 2025, "tempo": "00:27:51", "pace": "5:18", "conf": "Média"}, {"trecho": 11, "ano": 2025, "tempo": "00:31:48", "pace": "5:32", "conf": "Alta"}, {"trecho": 1, "ano": 2026, "tempo": "00:32:07", "pace": "4:54", "conf": "Média"}, {"trecho": 17, "ano": 2026, "tempo": "00:42:38", "pace": "5:12", "conf": "Alta"}];
const fmtKm = v => v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const runsBy = {}; RUNS.forEach(r => (runsBy[r.trecho] ||= []).push(r)); Object.values(runsBy).forEach(a => a.sort((x,y)=>x.ano-y.ano));
const hms = s => { const [h,m,sec]=s.split(':'); return (+h)+':'+m+':'+String(Math.round(parseFloat(sec.replace(',','.')))).padStart(2,'0'); };
const ps = p => { const [m,s]=p.split(':'); return +m*60+ +s; };
function repInfo(rs){
  if(!rs || rs.length<2) return null;
  const a=rs[0], b=rs[rs.length-1], d=ps(b.pace)-ps(a.pace), ad=Math.abs(d);

  return {anos: rs.map(r=>r.ano).join(' → '), txt, n: rs.length};
}
/* ---------- projeção em células (grade de pixels) ---------- */
const all = TRECHOS.flatMap(t=>t.pts);
const la0=Math.min(...all.map(p=>p[0])), la1=Math.max(...all.map(p=>p[0])), lo0=Math.min(...all.map(p=>p[1])), lo1=Math.max(...all.map(p=>p[1]));
const GW=128, M=17, SX=1.5, kc=Math.cos(27.6*Math.PI/180);

const xy = p => [Math.round(M+(p[1]-lo0)*kc*SX*sc), Math.round(M+(la1-p[0])*sc)];

}
let cell = fit(); addEventListener('resize',()=>{cell=fit(); placeSprites();});
const P = TRECHOS.map(t=>t.pts.map(xy)); const finish = xy(TRECHOS[18].end);
/* ---------- utilitários de pixel ---------- */
function hash(x,y){ let h=(x*374761393+y*668265263)^0x5bd1e995; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967295; }
function stamp(ctx,x,y,s,col){ ctx.fillStyle=col; const h=s>>1; ctx.fillRect(x-h,y-h,s,s); }
function pline(ctx,a,b,s,col,st,pat){ const dx=b[0]-a[0],dy=b[1]-a[1],n=Math.max(Math.abs(dx),Math.abs(dy),1);

    if(pat){ if((st.k++ % pat[0]) >= pat[1]) continue; } stamp(ctx,x,y,s,col);} }
function ppath(ctx,pts,s,col,pat){ const st={k:0}; for(let i=0;i<pts.length-1;i++) pline(ctx,pts[i],pts[i+1],s,col,st,pat); }
function sprite(ctx,rows,pal,ox=0,oy=0){ rows.forEach((r,y)=>[...r].forEach((c,x)=>{ if(pal[c]){ ctx.fillStyle=pal[c]; ctx.fillRect(ox+x,oy+y,1,1);} })); }
/* ---------- máscara de terra ---------- */
const m = document.createElement('canvas'); m.width=GW; m.height=GH; const mc=m.getContext('2d');
mc.fillStyle='#000'; mc.strokeStyle='#000'; mc.lineJoin='round'; mc.lineCap='round';
const ring = P.flatMap(p=>p); mc.beginPath(); ring.forEach((p,i)=>i?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1])); mc.closePath(); mc.fill();
mc.lineWidth=13; mc.stroke();
ring.forEach((p,i)=>{ if(i%3) return; const r=5+hash(p[0],p[1])*5; mc.beginPath(); mc.arc(p[0]+(hash(i,3)-.5)*6,p[1]+(hash(i,7)-.5)*6,r,0,7); mc.fill(); });
const md = mc.getImageData(0,0,GW,GH).data, land = new Uint8Array(GW*GH);
for(let i=0;i<GW*GH;i++) land[i]= md[i*4+3]>110?1:0;
const L=(x,y)=> x<0||y<0||x>=GW||y>=GH?0:land[y*GW+x];
/* ---------- camada base (água + terra) ---------- */
const base=document.getElementById('base'); base.width=GW; base.height=GH; const bx=base.getContext('2d');
// terra pré-colorida
const landImg = new ImageData(GW,GH); const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const COL={g1:hex('#5cc04a'),g2:hex('#4cae3e'),g3:hex('#3a9a34'),sand:hex('#f2dc98'),foam:hex('#ffffff'),trunk:hex('#7a4a1c'),leaf:hex('#1f7a2c'),leaf2:hex('#2f9a3c'),hill:hex('#46a838'),hillD:hex('#2a7a2a'),blk:hex('#101010')};
const setPx=(x,y,c)=>{ if(x<0||y<0||x>=GW||y>=GH) return; const i=(y*GW+x)*4; landImg.data[i]=c[0];landImg.data[i+1]=c[1];landImg.data[i+2]=c[2];landImg.data[i+3]=255; };
for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){ if(!L(x,y)) continue;
  const edge = !L(x-1,y)||!L(x+1,y)||!L(x,y-1)||!L(x,y+1);
  const edge2 = !L(x-2,y)||!L(x+2,y)||!L(x,y-2)||!L(x,y+2);
  let c; if(edge) c=COL.sand; else if(edge2) c=COL.g3; else { const b=hash(x>>2,y>>2); c = b<.28?COL.g2 : b<.34?COL.g3 : COL.g1; if(((x+y)&7)===0 && hash(x,y)<.35) c=COL.g2; }

const near = new Uint8Array(GW*GH); const mark=(x,y,r)=>{for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const a=x+i,b=y+j; if(a>=0&&b>=0&&a<GW&&b<GH) near[b*GW+a]=1;}};
P.forEach(p=>{ for(let i=0;i<p.length-1;i++){ const a=p[i],b=p[i+1],n=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]),1); for(let k=0;k<=n;k++) mark(Math.round(a[0]+(b[0]-a[0])*k/n),Math.round(a[1]+(b[1]-a[1])*k/n),5); } });
mark(finish[0],finish[1],10);
function inner(x,y,r){ for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++) if(!L(x+i,y+j)) return false; return true; }
// árvores
const treeRows=['..ggg..','.gGgGg.','ggGgGgg','.gGgGg.','..ttt..','..ttt..'];
for(let y=4;y<GH-6;y+=5)for(let x=4;x<GW-6;x+=5){ const hx=x+Math.floor(hash(x,y)*3), hy=y+Math.floor(hash(y,x)*3);
  if(hash(x*3,y*7)<.4 && inner(hx,hy,5) && !near[hy*GW+hx]){ treeRows.forEach((r,j)=>[...r].forEach((ch,i)=>{ if(ch==='.')return; setPx(hx-3+i,hy-3+j, ch==='t'?COL.trunk: ch==='G'?COL.leaf2:COL.leaf); })); } }
// colinas (morros) nos trechos com "Morro"
function hill(cx,cy){ for(let j=0;j<8;j++)for(let i=-6;i<=6;i++){ const d=(i*i)/36+((7-j)*(7-j))/49; if(d<=1){ const edge=d>.72; setPx(cx+i,cy-8+j+1, edge?COL.hillD:COL.hill);} } setPx(cx-2,cy-5,COL.blk);setPx(cx-2,cy-4,COL.blk);setPx(cx+2,cy-5,COL.blk);setPx(cx+2,cy-4,COL.blk); }
const cxm = GW/2, cym = GH/2;
TRECHOS.forEach((t,i)=>{ if(/Morro/i.test(t.nome)){ const p=P[i], mid=p[Math.floor(p.length/2)]; const vx=cxm-mid[0], vy=cym-mid[1], l=Math.hypot(vx,vy)||1; const hx=Math.round(mid[0]+vx/l*12), hy=Math.round(mid[1]+vy/l*12); if(L(hx,hy)) hill(hx,hy); } });
// ondas animadas
let frame=0; const waterBase=hex('#2f66d0'), waveC=hex('#6a98f2'), waveD=hex('#2557b8');
function drawBase(){
  const img=bx.createImageData(GW,GH), d=img.data;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){ const i=(y*GW+x)*4;
    if(landImg.data[i+3]){ d[i]=landImg.data[i];d[i+1]=landImg.data[i+1];d[i+2]=landImg.data[i+2];d[i+3]=255; continue; }

/* ---------- camada estática: caminhos, fases, estrelas ---------- */
const stat=document.getElementById('stat'); stat.width=GW; stat.height=GH; const sx=stat.getContext('2d');
TRECHOS.forEach((t,i)=>{ const done=!!runsBy[t.n];
  ppath(sx,P[i],5,'#2a1a08',done?null:[3,2]);
  ppath(sx,P[i],3,done?'#f4dc9a':'#cdb77a',done?null:[3,2]); });
const star=['..y..','.yyy.','yyyyy','.yyy.','y...y'];
TRECHOS.forEach((t,i)=>{ const rs=runsBy[t.n], done=!!rs, [x,y]=P[i][0];
  // nó da fase (disco 9x9 estilo overworld)
  for(let j=-5;j<=5;j++)for(let k=-5;k<=5;k++){ const d=k*k+j*j; if(d<=25){ stamp(sx,x+k,y+j,1, d>16?'#101010': done?(d<6&&j<0&&k<0?'#ff9a9a':'#e83030'):(d<6&&j<0&&k<0?'#fff6a0':'#f8d820')); } }
  if(rs&&rs.length>1){ sprite(sx,star,{y:'#f8d820'},x-2,y-12); sprite(sx,['.....','.....','.....','.....','.....'],{},0,0); }
});

/* ---------- rótulos e sobreposições ---------- */
const labels=document.getElementById('labels'), ov=document.getElementById('ov'), hl=document.getElementById('hl'), hc=hl.getContext('2d');
hl.width=GW; hl.height=GH; ov.setAttribute('viewBox',`0 0 ${GW} ${GH}`);
const NS='http://www.w3.org/2000/svg';
TRECHOS.forEach((t,i)=>{
  const [x,y]=P[i][0]; const lb=document.createElement('span'); lb.className='lab'; lb.textContent=t.n; lb.dataset.x=x; lb.dataset.y=y+7; labels.appendChild(lb);
  const pl=document.createElementNS(NS,'polyline'); pl.setAttribute('class','hit'); pl.setAttribute('points',P[i].map(p=>p.join(',')).join(' ')); ov.appendChild(pl);
  const c=document.createElementNS(NS,'circle'); c.setAttribute('class','nd'); c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',6.5); ov.appendChild(c);
  [pl,c].forEach(el=>{ el.addEventListener('mouseenter',e=>{hlOn(t.n);showTip(t,e)}); el.addEventListener('mousemove',moveTip); el.addEventListener('mouseleave',()=>{hlOff();hideTip()}); el.addEventListener('click',e=>{hlOn(t.n);showTip(t,e)}); });
});
function placeSprites(){
  document.querySelectorAll('.lab').forEach(l=>{ l.style.left=(l.dataset.x*cell)+'px'; l.style.top=(l.dataset.y*cell)+'px'; });
  const mrc=document.getElementById('mario'), [x,y]=P[0][0]; mrc.style.width=9*cell+'px'; mrc.style.height=13*cell+'px'; mrc.style.left=((x-14)*cell)+'px'; mrc.style.top=((y-9)*cell)+'px';
  const cc=document.getElementById('castle'); cc.style.width=15*cell+'px'; cc.style.height=15*cell+'px'; cc.style.left=((finish[0]-20)*cell)+'px'; cc.style.top=((finish[1]-2)*cell)+'px';
}
placeSprites();
/* ---------- destaque ---------- */
function hlOn(n){ const i=n-1; hc.clearRect(0,0,GW,GH); ppath(hc,P[i],7,'#ffffff'); ppath(hc,P[i],5,'#f8d820');
  const [x,y]=P[i][0]; for(let j=-7;j<=7;j++)for(let k=-7;k<=7;k++){ const d=k*k+j*j; if(d>=42&&d<=56) stamp(hc,x+k,y+j,1,'#fff'); }
  items[n]?.classList.add('on'); items[n]?.scrollIntoView({block:'nearest'}); }
function hlOff(){ hc.clearRect(0,0,GW,GH); Object.values(items).forEach(li=>li.classList.remove('on')); }
/* ---------- balão ---------- */
const tip=document.getElementById('tip');
function tipHTML(t){
  const rs=runsBy[t.n]; let h=`<h4>Fase ${t.n} · ${fmtKm(t.km)} km</h4><div class="nm">${t.nome}</div>`;
  if(!rs) return h+`<div class="no">○ Ainda não feita</div>`;
  h+=`<div class="ok">● COMPLETA${rs.length>1?` · ${rs.length}×`:''}</div><table>`;
  rs.forEach(r=>h+=`<tr><td>${r.ano}${r.conf==='Média'?'*':''}</td><td>${hms(r.tempo)}</td><td>${r.pace}/km</td></tr>`);
  h+=`</table>`; const rp=repInfo(rs); if(rp) h+=`<div class="rp">★ REPETIDA<br>${rp.anos} · ${rp.txt}</div>`;
  if(rs.some(r=>r.conf==='Média')) h+=`<small>* inferido (menor certeza)</small>`; return h;
}
function showTip(t,e){ tip.innerHTML=tipHTML(t); tip.style.display='block'; moveTip(e); }
function moveTip(e){ const w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+18,y=e.clientY+18; if(x+w>innerWidth-8)x=e.clientX-w-18; if(y+h>innerHeight-8)y=innerHeight-h-8; tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px'; }
function hideTip(){ tip.style.display='none'; }
/* ---------- lista + HUD ---------- */
const items={}, ol=document.getElementById('list');
TRECHOS.forEach(t=>{ const rs=runsBy[t.n], rp=repInfo(rs), li=document.createElement('li'); li.className=rs?'done':'todo';
  const yr = rs ? rs.map(r=>`${r.ano}${r.conf==='Média'?'*':''} ${r.pace}`).join(' · ')+(rp?` <span class="rp">★${rp.n}×</span>`:'') : 'não feita';
  li.innerHTML=`<span class="n">${t.n}</span><span class="t">${t.nome}</span><span class="k">${fmtKm(t.km)}</span><span class="y">${yr}</span>`;
  li.onmouseenter=()=>hlOn(t.n); li.onmouseleave=hlOff; items[t.n]=li; ol.appendChild(li); });
const total=TRECHOS.reduce((a,t)=>a+t.km,0), feitos=TRECHOS.filter(t=>runsBy[t.n]), kmF=feitos.reduce((a,t)=>a+t.km,0), nRep=feitos.filter(t=>runsBy[t.n].length>1).length;
hKm.textContent=fmtKm(kmF); hTot.textContent=fmtKm(total); hN.textContent=feitos.length; hR.textContent=nRep;
TRECHOS.forEach(t=>{ const i=document.createElement('i'); const rs=runsBy[t.n]; if(rs) i.className=rs.length>1?'on rep':'on'; i.title='Trecho '+t.n; meter.appendChild(i); });
</script>
